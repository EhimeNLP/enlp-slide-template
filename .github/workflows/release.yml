name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Create distribution folder
        run: |
          mkdir -p dist/enlp-slide-template
          cp -r src/* dist/enlp-slide-template/
          cp docs/documentation.pdf dist/enlp-slide-template/

      - name: Compress dist
        run: cd dist && zip -r ../enlp-slide-template-${{ github.ref_name }}.zip enlp-slide-template

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: enlp-slide-template-${{ github.ref_name }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}